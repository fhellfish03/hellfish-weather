name: Record weather

# Runs every 3 hours. The script saves one morning forecast per day per town,
# fills in what actually happened, and refreshes the hurricane center storm list.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: record-weather
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Record forecasts and observations
        run: node scripts/record.mjs
      - name: Save data to the repository
        run: |
          git config user.name "hellfish-weather-recorder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record weather $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
