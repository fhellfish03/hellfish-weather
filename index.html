<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HellFish Weather">
<title>HellFish Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow column, phone first. Location switch, current conditions, alerts, hourly strip, daily list. */
:root {
  /* Sky colors are set by script from the real sun position and cloud cover. Everything else sits on dark glass, so text contrast never depends on the sky. */
  --sky-top: #16223f;
  --sky-bot: #33496e;
  --bg: #0c1420;
  --surface: rgba(9, 15, 25, .58);
  --surface-2: rgba(255, 255, 255, .07);
  --fg: #eef3f8;
  --muted: #a9b6c6;
  --line: rgba(255, 255, 255, .14);
  --accent: #8fc3ff;
  --accent-fg: #0a1220;
  --warn-bg: rgba(242, 193, 78, .16);
  --warn-fg: #f6d27a;
  --warn-line: rgba(242, 193, 78, .55);
  --frost-bg: rgba(143, 195, 255, .14);
  --frost-fg: #d3e6ff;
  --go-bg: rgba(143, 195, 255, .18);
  --go-fg: #d6e8ff;
  --font-display: "Saira Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; } /* hidden must win over any display rule */
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding-block: 12px; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Location switch */
.locs { display: grid; grid-template-columns: .8fr 1.25fr 1fr 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.locs button { border: 0; background: transparent; border-radius: 9px; padding: 8px 3px; font-weight: 700; font-size: 13.5px; min-width: 0; cursor: pointer; line-height: 1.15; }
.locs button small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.locs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.locs button[aria-pressed="true"] small { color: inherit; opacity: .85; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 0 0 10px; }

/* Current */
.now { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; }
.now-temp { font-family: var(--font-display); font-weight: 700; font-size: 72px; line-height: .9; display: flex; align-items: flex-start; gap: 6px; }
.now-temp .swatch { width: 10px; height: 52px; border-radius: 5px; margin-top: 6px; }
.now-cond { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.now-cond svg { width: 30px; height: 30px; flex: none; }
.now-sub { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.stat dt { font-size: 12px; color: var(--muted); }
.stat dd { margin: 0; font-weight: 700; font-size: 17px; }
.stat dd small { font-weight: 400; color: var(--muted); font-size: 13px; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.refresh { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 13px; }

/* Alerts */
.alert { border: 1px solid var(--warn-line); background: var(--warn-bg); color: var(--warn-fg); border-radius: 12px; padding: 10px 12px; }
.alert + .alert { margin-top: 8px; }
.alert summary { cursor: pointer; font-weight: 700; display: flex; gap: 8px; align-items: baseline; list-style: none; }
.alert summary::-webkit-details-marker { display: none; }
.alert summary::before { content: "\26A0"; }
.alert .when { font-size: 13px; margin-top: 2px; }
.alert p { white-space: pre-wrap; font-size: 13px; margin: 8px 0 0; }
.clear { color: var(--muted); }

/* Hourly */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tabs button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
.tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
.metric-note { font-size: 13px; color: var(--muted); margin: -2px 0 10px; }
.hscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -14px; padding: 0 14px 4px; }
.hgrid { display: grid; grid-auto-flow: column; grid-auto-columns: 58px; position: relative; }
.hcol { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; font-size: 13px; }
.hcol .t { font-weight: 700; color: var(--muted); }
.hcol.is-now .t { color: var(--fg); }
.hcol svg.ic { width: 26px; height: 26px; }
.hchart { grid-column: 1 / -1; height: 96px; }
.hrow { display: contents; }
.rain { font-weight: 700; }
.rain.zero { color: var(--muted); font-weight: 400; }
.wind { font-size: 12px; color: var(--muted); line-height: 1.2; }
.wind svg { width: 12px; height: 12px; vertical-align: -1px; }
.daybreak { border-left: 1px dashed var(--line); }
.daybands { display: grid; grid-auto-flow: column; margin-bottom: 6px; }
.dayband { border-left: 1px dashed var(--line); font-size: 12px; font-weight: 700; color: var(--muted); min-width: 0; }
.dayband:first-child { border-left: 0; }
.dayband span { position: sticky; left: 0; display: inline-block; padding: 2px 8px; background: var(--surface-2); border-radius: 6px; white-space: nowrap; }
.rowlabels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }

/* Daily */
.days { display: flex; flex-direction: column; }
.day { display: grid; grid-template-columns: 64px 28px minmax(0, 1fr); gap: 2px 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.day:first-child { border-top: 0; padding-top: 0; }
.day .dn { font-weight: 700; }
.day .dn small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.day svg.ic { width: 26px; height: 26px; }
.day .main { min-width: 0; }
.day .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.day .cond { font-weight: 700; }
.day .hl { font-size: 15px; white-space: nowrap; }
.day .hl b { font-size: 17px; }
.bar { position: relative; height: 6px; background: var(--surface-2); border-radius: 3px; margin: 6px 0; }
.bar span { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.day .det { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.day .det b { color: var(--fg); font-weight: 700; }

/* Home overview */
.glance { font-size: 14px; display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.glance b { font-weight: 700; }
.tiles { display: flex; flex-direction: column; gap: 10px; }
.tile { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
.tile:hover { border-color: var(--accent); }
.tile-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tile-name { font-weight: 700; font-size: 16px; }
.tile-name small { font-weight: 400; color: var(--muted); font-size: 13px; }
.tile-time { color: var(--muted); font-size: 13px; white-space: nowrap; }
.tile-body { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; margin-top: 6px; }
.tile-temp { font-family: var(--font-display); font-weight: 700; font-size: 52px; line-height: .95; display: flex; align-items: flex-start; gap: 5px; }
.tile-temp .swatch { width: 8px; height: 38px; border-radius: 4px; margin-top: 5px; }
.tile-cond { font-weight: 700; display: flex; align-items: center; gap: 6px; }
.tile-cond svg { width: 24px; height: 24px; flex: none; }
.tile-sub { color: var(--muted); font-size: 13px; }
.tile-facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.tile-facts b { color: var(--fg); }
.tile-alert { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--warn-fg); background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 8px; padding: 4px 8px; display: inline-block; }
.tile-alert::before { content: "\26A0  "; }
.tile-ok { margin-top: 8px; font-size: 13px; color: var(--muted); }
.tile-more { float: right; color: var(--accent); font-size: 13px; font-weight: 700; margin-top: 8px; }
.cmp-wrap { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
.cmp { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 330px; }
.cmp th, .cmp td { padding: 7px 4px; text-align: left; border-top: 1px solid var(--line); vertical-align: top; }
.cmp thead th { border-top: 0; font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.cmp td small { display: block; color: var(--muted); font-size: 12px; }
.cmp tbody th { font-weight: 700; }
/* Rain timing, frost, yesterday */
.callouts { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.callout { display: flex; gap: 8px; align-items: flex-start; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.callout svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.callout b { font-weight: 700; }
.callout.frost { background: var(--frost-bg); color: var(--frost-fg); }

/* Fort Oglethorpe pages: Weather and Garden & sky, switched by tabs or a sideways swipe */
.subnav { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.subnav button { border: 0; background: transparent; border-radius: 9px; padding: 7px 4px; font-weight: 700; font-size: 14px; cursor: pointer; }
.subnav button[aria-selected="true"] { background: var(--surface-2); box-shadow: inset 0 -3px 0 var(--accent); }
.swipe-hint { font-size: 12px; color: var(--muted); text-align: center; margin: -8px 0 0; }
#detail { display: flex; flex-direction: column; gap: 14px; }
@media (prefers-reduced-motion: no-preference) {
  #detail.slide-left { animation: slideL .22s ease-out; }
  #detail.slide-right { animation: slideR .22s ease-out; }
}
@keyframes slideL { from { transform: translateX(28px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes slideR { from { transform: translateX(-28px); opacity: .4; } to { transform: none; opacity: 1; } }
.hscroll { overscroll-behavior-x: contain; }

/* Garden and sky */
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.row:first-child { border-top: 0; padding-top: 0; }
.row-h { font-weight: 700; font-size: 14px; }
.row-b { min-width: 0; font-size: 14px; }
.row-b small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.chip { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 8px; margin-right: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); white-space: nowrap; }
.chip.go { background: var(--go-bg); color: var(--go-fg); border-color: transparent; }
.chip.wait { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-line); }
.plants { display: flex; flex-direction: column; gap: 4px; }
.card-sub { font-size: 13px; color: var(--muted); margin: -6px 0 10px; }
.today-line { font-size: 15px; font-weight: 700; margin: 10px 0 0; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
.card a { color: var(--accent); }
.sky-verdict { font-size: 16px; font-weight: 700; margin: 0 0 4px; }

/* Radar */
.radar-map { height: 320px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.radar-ctl { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.radar-ctl button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 700; min-width: 76px; }
.radar-ctl input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.radar-time { font-size: 13px; min-width: 92px; text-align: right; }
.legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; margin-top: 10px; font-size: 12px; }
.legend span { display: flex; align-items: center; gap: 6px; min-width: 0; }
.legend i { width: 18px; height: 12px; border-radius: 3px; flex: none; border: 1px solid var(--line); }
.legend small { color: var(--muted); }
.radar-note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.leaflet-container { font-family: var(--font-body); }
.err { border: 1px solid var(--warn-line); background: var(--warn-bg); color: var(--warn-fg); border-radius: 12px; padding: 12px; }
.loading { color: var(--muted); padding: 20px 0; text-align: center; }
footer { font-size: 12px; color: var(--muted); text-align: center; }
footer a { color: inherit; }
@media (prefers-reduced-motion: no-preference) { .locs button, .tabs button { transition: background .15s, color .15s; } }

/* ===== Instrument panel over a live sky ===== */
#skybg { position: fixed; inset: 0; z-index: -1; background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 70%, var(--sky-bot) 100%); transition: background 1.2s ease; }
body { background: var(--bg); padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
.wrap { gap: 12px; }
.card, .tile, .subnav { background: var(--surface); border: 1px solid var(--line); -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); }
.card { border-radius: 18px; padding: 16px; }
.label { font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: .01em; text-transform: none; color: var(--fg); margin: 0 0 10px; }
a { color: var(--accent); }

/* Bottom bar: thumb reach */
.locs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; border-radius: 0; border: 0; border-top: 1px solid var(--line); grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0;
  background: rgba(7, 11, 19, .82); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.locs button { border-radius: 0; padding: 8px 2px 6px; font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: .01em; color: var(--muted); border-top: 3px solid transparent; }
.locs button { display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.1; }
.nav-ic { width: 26px; height: 26px; }
.locs button { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15.5px; }
.locs button[aria-pressed="true"] { background: transparent; color: var(--fg); border-top-color: var(--accent); }

/* Town header */
.townhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 6px 2px 0; text-shadow: 0 1px 10px rgba(0, 0, 0, .35); }
.townhead h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1; margin: 0; letter-spacing: .005em; }
.townhead h1 small { font-size: 18px; font-weight: 500; color: var(--muted); margin-left: 6px; }
.townhead .clock { font-family: var(--font-display); font-size: 18px; color: var(--muted); white-space: nowrap; }

/* Hero: reading straight off the sky, then a glass strip of gauges */
#current { background: transparent; border: 0; -webkit-backdrop-filter: none; backdrop-filter: none; padding: 4px 2px 0; text-shadow: 0 1px 14px rgba(0, 0, 0, .4); }
#current .label { display: none; }
.now { grid-template-columns: auto minmax(0, 1fr); gap: 2px 16px; }
.now-temp { font-size: 112px; line-height: .82; font-weight: 600; letter-spacing: -.02em; gap: 0; }
.now-temp .swatch { width: 6px; height: 74px; border-radius: 3px; margin: 10px 10px 0 0; }
.now-cond { font-family: var(--font-display); font-size: 24px; font-weight: 600; }
.now-sub { color: var(--fg); opacity: .82; }
.today-line { background: transparent; padding: 0; margin: 14px 0 0; font-size: 19px; line-height: 1.35; font-weight: 700; max-width: 34ch; }
#current .stats { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; padding: 4px 0; text-shadow: none; }
#current .stat { background: transparent; border-radius: 0; padding: 10px 12px; border-left: 1px solid var(--line); }
#current .stat:nth-child(3n+1) { border-left: 0; }
#current .stat:nth-child(n+4) { border-top: 1px solid var(--line); }
#current .stat dt { font-size: 12px; color: var(--muted); }
#current .stat dd { font-family: var(--font-display); font-size: 26px; font-weight: 600; line-height: 1.1; }
#current .stat dd small { display: block; font-family: var(--font-body); font-size: 12px; line-height: 1.3; margin-top: 2px; }
#current .callouts { text-shadow: none; }
#current .callout { background: var(--surface); border: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
#current .callout.frost { background: rgba(70, 110, 190, .38); }
#current .meta { color: var(--fg); opacity: .78; text-shadow: none; }
#current .refresh, .refresh { background: var(--surface); border-color: var(--line); }
.alert-line { margin-top: 10px; font-size: 14px; opacity: .85; }

/* Quiet cards stay one line */
.card.slim { padding: 11px 16px; font-size: 14px; color: var(--muted); }
.card.slim b { color: var(--fg); font-family: var(--font-display); font-size: 17px; font-weight: 600; margin-right: 6px; }

/* Page toggle */
.subnav { border-radius: 14px; }
.subnav button { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--muted); }
.subnav button[aria-selected="true"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 -3px 0 var(--accent); }

/* Home: each town tile carries its own current sky */
.home-head { padding: 6px 2px 2px; text-shadow: 0 1px 10px rgba(0, 0, 0, .35); }
.home-head h1 { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1.05; margin: 0; }
.home-head p { margin: 4px 0 0; color: var(--fg); opacity: .8; }
.tile { border-radius: 18px; background: linear-gradient(rgba(6, 10, 18, .42), rgba(6, 10, 18, .62)), linear-gradient(165deg, var(--t1, #1b2a4a), var(--t2, #33496e)); }
.tile-name { font-family: var(--font-display); font-size: 21px; font-weight: 600; }
.tile-temp { font-size: 64px; font-weight: 600; }
.tile .today-line { font-size: 15px; margin-top: 10px; }
.tile-alert { background: var(--warn-bg); }

/* Charts and tables read on glass */
.daybands .dayband span { background: rgba(255, 255, 255, .08); }
.bar { background: rgba(255, 255, 255, .08); }
.stat { background: var(--surface-2); }
.cmp thead th { text-transform: none; letter-spacing: 0; font-size: 13px; }
.leaflet-container { background: #1b1f26; }
@media (max-width: 380px) { .now-temp { font-size: 96px; } #current .stat dd { font-size: 22px; } }
</style>
</head>
<body>
<div id="skybg" aria-hidden="true"></div>
<div class="wrap">
  <nav class="locs" id="locs" aria-label="Location"></nav>
  <header class="townhead" id="townhead" hidden></header>
  <div id="status"></div>
  <div id="home" hidden></div>
  <div class="subnav" id="subnav" role="tablist" aria-label="Town pages" hidden>
    <button type="button" role="tab" id="page-weather" data-page="weather" aria-selected="true">Weather</button>
    <button type="button" role="tab" id="page-yard" data-page="yard" aria-selected="false">Outdoors</button>
  </div>
  <p class="swipe-hint" id="swipe-hint" hidden>Swipe sideways to switch</p>
  <div id="detail">
  <section class="card" id="current" aria-labelledby="cur-h" hidden></section>
  <section class="card" id="alerts" aria-labelledby="al-h" hidden></section>
  <section class="card" id="hourly" aria-labelledby="hr-h" hidden></section>
  <section class="card" id="coast" aria-labelledby="co-h" hidden></section>
  <section class="card" id="tropics" aria-labelledby="tr-h" hidden></section>
  <section class="card" id="desert" aria-labelledby="de-h" hidden></section>
  <section class="card" id="daily" aria-labelledby="dy-h" hidden></section>

const SKY = {
  night: ["#060a19", "#18223f"], dawn: ["#22305d", "#cf8f6c"], day: ["#2160b5", "#73a9e2"],
  golden: ["#2b5aa3", "#dba468"], dusk: ["#1b2250", "#a85d78"]
};
const GRAY = { day: ["#56616f", "#8a95a2"], night: ["#1a1e26", "#2a3039"] };
function hexMix(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
function skyColors(d) {
  if (!d) return SKY.night;
  const ti = todayIndex(d), nowIso = localNowISO(d.utc_offset_seconds);
  const mins = iso => Number(iso.slice(11, 13)) * 60 + Number(iso.slice(14, 16));
  const m = mins(nowIso), rise = mins(d.daily.sunrise[ti]), set = mins(d.daily.sunset[ti]);
  let phase = "day";
  if (m < rise - 50 || m > set + 50) phase = "night";
  else if (m < rise + 40) phase = "dawn";
  else if (m > set - 25) phase = "dusk";
  else if (m > set - 90) phase = "golden";
  let [top, bot] = SKY[phase];
  const hi = nowHourIndex(d), cloud = d.hourly.cloud_cover ? d.hourly.cloud_cover[hi] ?? 0 : 0, code = d.current.weather_code;
  const g = phase === "night" ? GRAY.night : GRAY.day;
  const mix = Math.min(1, Math.max(0, (cloud - 30) / 70)) * .85;
  top = hexMix(top, g[0], mix); bot = hexMix(bot, g[1], mix);
  if (code >= 61) { top = hexMix(top, "#000000", code >= 95 ? .35 : .18); bot = hexMix(bot, "#000000", code >= 95 ? .35 : .18); }
  return [top, bot];
}
function applySky(d) {
  const [t, b] = skyColors(d);
  document.documentElement.style.setProperty("--sky-top", t);
  document.documentElement.style.setProperty("--sky-bot", b);
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute("content", t);
}

      <div class="stat"><dt>UV index</dt><dd>${r0(d.hourly.uv_index ? d.hourly.uv_index[hi0] ?? 0 : 0)} <small>${uvLabel(d.hourly.uv_index ? d.hourly.uv_index[hi0] ?? 0 : 0)} · peak ${r0(d.daily.uv_index_max ? d.daily.uv_index_max[day0] ?? 0 : 0)}</small></dd></div>

const METRICS = {
  temp:  { key: "temperature_2m", label: "Temp", note: "Air temperature in the shade." },
  feels: { key: "apparent_temperature", label: "Feels like", note: "Temperature adjusted for humidity and wind." },
  dew:   { key: "dew_point_2m", label: "Dew point", note: "Under 55° dry, 55 to 65° comfortable to slightly humid, 65 to 70° muggy, 70°+ oppressive." }
};

function renderHourly(d) {
  const h = d.hourly;
  const nowISO = localNowISO(d.utc_offset_seconds).slice(0, 13);
  let start = h.time.findIndex(t => t.slice(0, 13) === nowISO);
  if (start < 0) start = 0;
  const idx = [];
  for (let i = start; i < Math.min(h.time.length, start + HOURS_SHOWN); i++) idx.push(i);
  const m = METRICS[state.metric] || METRICS.temp;
  const vals = idx.map(i => h[m.key][i]);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = Math.max(hi - lo, 6);
  const W = 58, H = 96, top = 22, bot = 12;
  const ys = vals.map(v => {
    const pad = (span - (hi - lo)) / 2;
    return top + (1 - (v - lo + pad) / span) * (H - top - bot);
  });
  const xs = idx.map((_, k) => k * W + W / 2);
  const totalW = idx.length * W;
  let segs = "";
  for (let k = 0; k < idx.length - 1; k++) {
    segs += `<line x1="${xs[k]}" y1="${ys[k].toFixed(1)}" x2="${xs[k + 1]}" y2="${ys[k + 1].toFixed(1)}" stroke="${tempColor((vals[k] + vals[k + 1]) / 2)}" stroke-width="3" stroke-linecap="round"/>`;
  }
  const dots = idx.map((_, k) => `<circle cx="${xs[k]}" cy="${ys[k].toFixed(1)}" r="3.5" fill="${tempColor(vals[k])}" stroke="var(--surface)" stroke-width="1.5"/>
    <text x="${xs[k]}" y="${(ys[k] - 8).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--fg)" font-family="var(--font-body)">${r0(vals[k])}°</text>`).join("");
  const chart = `<svg class="hchart" viewBox="0 0 ${totalW} ${H}" width="${totalW}" height="${H}" role="img" aria-label="${m.label} for the next ${idx.length} hours, from ${r0(lo)} to ${r0(hi)} degrees">${segs}${dots}</svg>`;

  /* Date bands above the hours, so a scrolled strip always shows which day it is. The label sticks to the left edge. */
  const bands = [];
  idx.forEach((i, k) => {
    const day = h.time[i].slice(0, 10);
    if (!bands.length || bands[bands.length - 1].day !== day) bands.push({ day, n: 0, first: k === 0 });
    bands[bands.length - 1].n++;
  });
  const todayStr = h.time[idx[0]].slice(0, 10);
  const bandHTML = bands.map((b, j) => {
    const { dow, md } = dayParts(b.day);
    const name = b.day === todayStr ? "Today" : j === 1 && bands[0].day === todayStr ? "Tomorrow" : dow;
    return `<div class="dayband" style="grid-column: span ${b.n}"><span>${name === dow ? `${dow} ${md}` : `${name}, ${dow} ${md}`}</span></div>`;
  }).join("");
  const cols = idx.map((i, k) => {
    const t = h.time[i];
    const cond = condition(h.weather_code[i], h.is_day[i]);
    const p = h.precipitation_probability[i] ?? 0;
    const isMidnight = t.slice(11, 13) === "00" && k > 0;
    const label = k === 0 ? "Now" : isMidnight ? dayParts(t.slice(0, 10)).dow : hourLabel(t);
    return `<div class="hcol${k === 0 ? " is-now" : ""}${isMidnight ? " daybreak" : ""}">
      <span class="t">${label}</span>
      <span title="${esc(cond.text)}">${icon(cond.icon)}</span>
      <span class="rain num${p < 10 ? " zero" : ""}" aria-label="${p}% chance of rain"><svg viewBox="0 0 10 12" width="9" height="11" aria-hidden="true"><path d="M5 1C3.5 3.5 1.5 5.5 1.5 7.7A3.5 3.5 0 0 0 8.5 7.7C8.5 5.5 6.5 3.5 5 1z" fill="${RAIN_C}"/></svg> ${p}%</span>
    </div>`;
  }).join("");
  const winds = idx.map(i => {
    const ws = r0(h.wind_speed_10m[i]), g = r0(h.wind_gusts_10m[i]);
    return `<div class="hcol wind num" aria-label="Wind ${ws} miles per hour from the ${cardinal(h.wind_direction_10m[i])}, gusts ${g}">
      <span>${arrow(h.wind_direction_10m[i])} ${ws}</span><span>${cardinal(h.wind_direction_10m[i])}</span><span>g${g}</span></div>`;
  }).join("");

  $("hourly").innerHTML = `
    <h2 class="label" id="hr-h">Next ${idx.length} hours</h2>
    <div class="tabs" role="group" aria-label="Chart shows">
      ${Object.entries(METRICS).map(([k, v]) => `<button type="button" id="metric-${k}" data-metric="${k}" aria-pressed="${k === state.metric}">${v.label} °F</button>`).join("")}
    </div>
    <p class="metric-note">${m.note}</p>
    <div class="hscroll" id="hscroll">
      <div class="daybands" style="width:${totalW}px;grid-auto-columns:${W}px">${bandHTML}</div>
      <div class="hgrid" style="width:${totalW}px">${cols}</div>
      ${chart}
      <div class="hgrid" style="width:${totalW}px">${winds}</div>
    </div>
    <div class="rowlabels"><span>Top row: rain chance</span><span>Bottom row: wind mph, direction, gusts</span></div>`;
}

function renderDaily(d) {
  const dl = d.daily, t0 = todayIndex(d);
  const idxs = dl.time.map((_, i) => i).filter(i => i >= t0);
  const lo = Math.min(...idxs.map(i => dl.temperature_2m_min[i])), hi = Math.max(...idxs.map(i => dl.temperature_2m_max[i])), span = Math.max(hi - lo, 1);
  const rows = idxs.map(i => {
    const t = dl.time[i], k = i - t0;
    const cond = condition(dl.weather_code[i], 1);
    const { dow, md } = dayParts(t);
    const name = k === 0 ? "Today" : k === 1 ? "Tomorrow" : dow;
    const mx = r0(dl.temperature_2m_max[i]), mn = r0(dl.temperature_2m_min[i]);
    const left = ((dl.temperature_2m_min[i] - lo) / span) * 100, width = Math.max(((dl.temperature_2m_max[i] - dl.temperature_2m_min[i]) / span) * 100, 3);
    const p = dl.precipitation_probability_max[i] ?? 0;
    const amt = dl.precipitation_sum[i];
    return `<div class="day">
      <div class="dn">${name}<small>${k < 2 ? dow + " " : ""}${md}</small></div>
      <div title="${esc(cond.text)}">${icon(cond.icon)}</div>
      <div class="main">
        <div class="top"><span class="cond">${esc(cond.text)}</span><span class="hl num">H <b>${mx}°</b> · L <b>${mn}°</b></span></div>
        <div class="bar" aria-hidden="true"><span style="left:${left}%;width:${width}%;background:linear-gradient(90deg, ${tempColor(dl.temperature_2m_min[i])}, ${tempColor(dl.temperature_2m_max[i])})"></span></div>
        <div class="det num">
          <span>Feels <b>${r0(dl.apparent_temperature_max[i])}°/${r0(dl.apparent_temperature_min[i])}°</b></span>
          <span>Rain <b>${p}%</b>${amt >= 0.01 ? " · " + amt.toFixed(2) + " in" : ""}</span>
          <span>Wind <b>${r0(dl.wind_speed_10m_max[i])} ${cardinal(dl.wind_direction_10m_dominant[i])}</b> g${r0(dl.wind_gusts_10m_max[i])}</span>
          ${dl.uv_index_max ? `<span>UV <b>${r0(dl.uv_index_max[i] ?? 0)}</b> ${uvLabel(dl.uv_index_max[i] ?? 0)}</span>` : ""}
          <span>Sunrise <b>${clock(dl.sunrise[i])}</b>, sunset <b>${clock(dl.sunset[i])}</b></span>
        </div>
      </div>
    </div>`;
  }).join("");
  $("daily").innerHTML = `<h2 class="label" id="dy-h">${idxs.length}-day forecast</h2><div class="days">${rows}</div>`;
}

/* ---------- Home overview ---------- */
function todayIndex(d) {
  const today = localNowISO(d.utc_offset_seconds).slice(0, 10);
  const i = d.daily.time.indexOf(today);
  return i < 0 ? 0 : i;
}
function nextRain(d) {
  /* First hour in the next 12 with at least a 40% chance, as plain words. */
  const h = d.hourly, now = localNowISO(d.utc_offset_seconds).slice(0, 13);
  let s = h.time.findIndex(t => t.slice(0, 13) === now); if (s < 0) s = 0;
  for (let i = s; i < Math.min(h.time.length, s + 12); i++) {
    if ((h.precipitation_probability[i] ?? 0) >= 40) return i === s ? "Rain likely now" : `Rain likely by ${clock(h.time[i]).replace(":00", "")}`;
  }
  return "No rain likely next 12 hrs";
}
function renderHome() {
  const ready = LOCATIONS.filter(l => state.cache[l.id] && state.cache[l.id].data);

  if (ready.length > 1) {
    const now = ready.map(l => ({ l, d: state.cache[l.id].data }));
    const byT = [...now].sort((a, b) => b.d.current.temperature_2m - a.d.current.temperature_2m);
    const byDew = [...now].sort((a, b) => b.d.current.dew_point_2m - a.d.current.dew_point_2m);
    const byRain = [...now].sort((a, b) => (b.d.daily.precipitation_probability_max[todayIndex(b.d)] ?? 0) - (a.d.daily.precipitation_probability_max[todayIndex(a.d)] ?? 0));
    const rainTop = byRain[0], rainP = rainTop.d.daily.precipitation_probability_max[todayIndex(rainTop.d)] ?? 0;
    summary = `<section class="card" aria-labelledby="gl-h"><h2 class="label" id="gl-h">At a glance</h2><ul class="glance num">
      <li>Warmest now: <b>${esc(byT[0].l.name)} ${r0(byT[0].d.current.temperature_2m)}°</b>. Coolest: <b>${esc(byT[byT.length - 1].l.name)} ${r0(byT[byT.length - 1].d.current.temperature_2m)}°</b>.</li>
      <li>Most humid: <b>${esc(byDew[0].l.name)}</b>, dew point ${r0(byDew[0].d.current.dew_point_2m)}° (${dewLabel(r0(byDew[0].d.current.dew_point_2m)).toLowerCase()}). Driest: <b>${esc(byDew[byDew.length - 1].l.name)}</b>, ${r0(byDew[byDew.length - 1].d.current.dew_point_2m)}°.</li>

/* ---------- Today in one line ---------- */
function wearFor(t) { return t < 45 ? "coat" : t < 60 ? "jacket" : t < 70 ? "light layer" : t < 85 ? "t-shirt" : "hot"; }
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const shortClock = iso => clock(iso).replace(":00", "");
function todayLine(d) {
  const h = d.hourly, i0 = nowHourIndex(d), date = h.time[i0].slice(0, 10), hr = Number(h.time[i0].slice(11, 13));
  const evening = hr >= 17;
  /* Window: rest of the daytime (to 6 PM) or, in the evening, the next 12 hours */
  const win = [];
  for (let i = i0; i < h.time.length; i++) {
    if (!evening && (h.time[i].slice(0, 10) !== date || Number(h.time[i].slice(11, 13)) > 18)) break;
    if (evening && i >= i0 + 12) break;
    win.push(i);
  }
  const segs = [];
  const nowWear = wearFor(d.current.apparent_temperature);
  let target = null;
  if (!evening) {
    let peak = -Infinity; win.forEach(i => { if (h.apparent_temperature[i] > peak) peak = h.apparent_temperature[i]; });
    const peakWear = wearFor(peak);
    if (peakWear !== nowWear) target = { w: peakWear, i: win.find(i => wearFor(h.apparent_temperature[i]) === peakWear) };
    const when = hr < 12 ? "this morning" : "now";
    if (target) segs.push(`${nowWear === "hot" ? "Hot" : cap(nowWear)} ${when}`, `${target.w === "hot" ? "hot" : target.w} by ${shortClock(h.time[target.i])}`);
    else segs.push(nowWear === "hot" ? "Hot through the afternoon" : `${cap(nowWear)} weather through the afternoon`);
  } else {
    let low = Infinity; win.forEach(i => { if (h.apparent_temperature[i] < low) low = h.apparent_temperature[i]; });
    const lowWear = wearFor(low);
    if (lowWear !== nowWear) { const i = win.find(i => wearFor(h.apparent_temperature[i]) === lowWear); segs.push(`${cap(nowWear)} this evening`, `${lowWear} by ${shortClock(h.time[i])}`); }
    else segs.push(`${cap(nowWear)} weather tonight`);
  }
  const rt = rainTiming(d);
  const storm = win.find(i => h.weather_code[i] >= 95);
  const wetI = win.find(i => (h.precipitation_probability[i] ?? 0) >= 50);
  if (storm !== undefined) segs.push(`storms possible around ${shortClock(h.time[storm])}`);
  else if (rt && rt.wet && /^Rain now/.test(rt.text)) segs.push("rain now");
  else if (rt && rt.wet) segs.push(rt.text.replace(/^Rain starting around ([^ ]+ [AP]M).*$/, (m, t) => "rain around " + t.replace(":00", "")));
  else if (wetI !== undefined) segs.push(`rain likely after ${shortClock(h.time[wetI])}`);
  else if (win.every(i => (h.precipitation_probability[i] ?? 0) < 20)) segs.push("dry");
  const gust = Math.max(...win.map(i => h.wind_gusts_10m[i] || 0));
  if (gust >= 30) segs.push(`windy, gusts to ${r0(gust)}`);
  return segs.join(", ") + ".";
}

/* ---------- Air quality (US AQI from Open-Meteo) ---------- */

/* ---------- Clearwater: beach conditions ---------- */
function toF(v, unit) { return /C/.test(unit || "") ? v * 9 / 5 + 32 : v; }

function renderCoast(d, c) {

    row("Tides", next.length ? `<div class="plants">${next.map(t => `<div><b>${t.type === "H" ? "High" : "Low"}</b> ${fmtT(t)} <span class="num" style="color:var(--muted)">${Number(t.v).toFixed(1)} ft</span></div>`).join("")}</div><small>NOAA predictions for Clearwater Beach</small>` : "No upcoming tide times");

/* ---------- Clearwater: tropical storms (National Hurricane Center) ---------- */
const CLW = { lat: 27.9659, lon: -82.8001 };
function milesBetween(a, b) {

}

  return `${s0.type} ${s0.name}: ${r0(s0.mi)} mi ${s0.dir} of Clearwater`;
}
function renderTropics(c) {
  const el = $("tropics");

  el.classList.remove("slim");
  if (c.nhc === undefined) { el.classList.add("slim"); el.innerHTML = `<b id="tr-h">Tropics</b>Checking the hurricane center…`; return; }
  if (c.nhc === null) { el.classList.add("slim"); el.innerHTML = `<b id="tr-h">Tropics</b>Storm feed isn't reachable from the app yet. Check the ${link}.`; return; }
  const list = atlanticStorms(c) || [];
  if (!list.length) { el.classList.add("slim"); el.innerHTML = `<b id="tr-h">Tropics</b>No active Atlantic storms. ${season ? "Season runs through Nov 30." : "Outside hurricane season."} <a href="https://www.nhc.noaa.gov/gtwo.php" target="_blank" rel="noopener">7-day outlook</a>`; return; }

  if (!list.length) body = `<p class="clear">No active Atlantic storms. ${season ? "Hurricane season runs through Nov 30." : "Outside hurricane season (Jun 1 to Nov 30)."} The ${link} 7-day outlook shows areas being watched.</p>`;
  else body = `<div class="rows">${list.map(st => {
    const close = st.mi != null && st.mi < 300, near = st.mi != null && st.mi < 700;
    return `<div class="row"><div class="row-h">${esc(st.name || "Unnamed")}</div><div class="row-b"><span class="chip ${near ? "wait" : "go"}">${close ? "Watch closely" : near ? "Keep an eye on it" : "Far away"}</span>${esc(st.type)}${st.mph ? `, ${st.mph} mph winds` : ""}<small>${st.mi != null ? `${r0(st.mi)} mi ${st.dir} of Clearwater` : "Position unavailable"}${st.moving ? `, moving ${st.moving}` : ""}${st.url ? ` · <a href="${esc(st.url)}" target="_blank" rel="noopener">Advisory</a>` : ""}</small></div></div>`;

/* ---------- Queen Creek: heat and dust ---------- */

    : `<span class="chip go">Calm</span>no dust alerts and no strong gusts this week`);
  $("desert").innerHTML = `<h2 class="label" id="de-h">Desert watch</h2><div class="rows">${rows.join("")}</div>`;
}

/* ---------- Hiking window ---------- */
function hourScore(h, i) {
  let sc = 100;
  const p = h.precipitation_probability[i] ?? 0, code = h.weather_code[i], at = h.apparent_temperature[i], g = h.wind_gusts_10m[i] || 0;
  if (code >= 95) return -999;

}
function bestHike(d, dateStr, fromIdx) {

  const hrs = h.time.map((t, i) => i).filter(i => h.time[i].slice(0, 10) === dateStr && h.time[i].slice(0, 13) > rise && h.time[i].slice(0, 13) < set && i >= fromIdx);
  let best = null;

/* ---------- Photo light: golden hour, blue hour, and sunset color odds ---------- */
async function renderPhoto(d, loc) {
  const el = $("photo");

  const ok = await loadAstro();

  if (!ok) { el.innerHTML = `<h2 class="label" id="ph-h">Photo light</h2><p class="clear">The astronomy library didn't load. Check your connection and reopen the app.</p>`; return; }
  try { el.innerHTML = photoHTML(d, loc); }
  catch (e) { el.innerHTML = `<h2 class="label" id="ph-h">Photo light</h2><p class="clear">Couldn't work out the light (${esc(e.message)}).</p>`; }
}
function colorOdds(d, iso) {
  const h = d.hourly, i = h.time.findIndex(t => t.slice(0, 13) === iso.slice(0, 13));
  if (i < 0 || !h.cloud_cover_low) return null;
  const low = h.cloud_cover_low[i] ?? 0, mid = h.cloud_cover_mid[i] ?? 0, high = h.cloud_cover_high[i] ?? 0, tot = h.cloud_cover[i] ?? 0;
  const upper = Math.max(mid, high);
  if (tot >= 90 || low >= 75) return { cls: "wait", word: "Likely gray", why: `thick or low clouds (low ${low}%, total ${tot}%)` };
  if (upper >= 25 && upper <= 80 && low < 50) return { cls: "go", word: "Good color odds", why: `mid and high clouds ${upper}% to catch the light, low clouds ${low}%` };
  if (upper < 15 && low < 30) return { cls: "", word: "Clear", why: "clean golden light, but a plain sky" };

}

  const A = Astronomy, obs = new A.Observer(loc.lat, loc.lon, loc.elev || 0), now = new Date(), tz = d.timezone, off = d.utc_offset_seconds;
  const fmt = dt => dt.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: tz });
  const localISO = dt => new Date(dt.getTime() + off * 1000).toISOString().slice(0, 16);
  const t0 = todayIndex(d), wins = [];
  for (const k of [0, 1]) {
    const date = d.daily.time[t0 + k]; if (!date) continue;
    const midnight = new Date(Date.parse(date + "T00:00:00Z") - off * 1000);
    const at = (dir, alt, from) => { const r = A.SearchAltitude("Sun", obs, dir, from, 1, alt); return r ? r.date : null; };
    const mBlue = at(+1, -8, midnight), mGold = at(+1, -4, midnight), mEnd = at(+1, 6, midnight);
    const noon = new Date(midnight.getTime() + 12 * 3600e3);

    const rise = A.SearchRiseSet("Sun", obs, +1, midnight, 1), set = A.SearchRiseSet("Sun", obs, -1, noon, 1);

    if (eGold && eEnd) wins.push({ end: eEnd, label: `Evening ${dayLbl}`, text: `Golden hour ${fmt(eGold)} to ${fmt(eBlue)}, blue hour ${fmt(eBlue)} to ${fmt(eEnd)}`, sun: set && set.date, sunWord: "Sunset" });

  }).join("");
  return `<h2 class="label" id="ph-h">Photo light</h2><p class="card-sub">Golden hour: sun from 6° above to 4° below the horizon. Blue hour: 4° to 8° below.</p><div class="rows">${rows}</div>`;

/* ---------- Records: forecast scorecard and season log ----------
   Reads data/history/<town>.json, written every few hours by the recording job on GitHub.
   Each day holds the morning forecasts made 0 to 6 days ahead ("fc", keyed by lead) and what
   actually happened ("obs": airport station high and low, rain, and soil for Fort Oglethorpe). */

  if (!c || !c.alm || !c.alm.days) return null;

}
function renderRecords(d, c, loc) {
  const el = $("records");
  el.classList.remove("slim");
  const h = c.hist;
  if (h === undefined) { el.classList.add("slim"); el.innerHTML = `<b id="rc-h">Records</b>Loading history…`; return; }
  if (!h || !h.days) {
    const a0 = almanacToday(d, c);
    el.classList.add("slim");
    el.innerHTML = `<b id="rc-h">Records</b>${a0 && a0.nh != null ? `Normal today ${r0(a0.nh)}° / ${r0(a0.nl)}°, records ${r0(a0.rh)}° (${a0.rhy}) and ${r0(a0.rl)}° (${a0.rly}). ` : ""}The scorecard and season log start once the app is on GitHub.`;

  const dates = Object.keys(days).sort();
  const obsDates = dates.filter(x => days[x].obs && x < today);
  const rows = [], row = (hd, b) => rows.push(`<div class="row"><div class="row-h">${hd}</div><div class="row-b">${b}</div></div>`);

  /* Scorecard: last 30 days */
  const recent = obsDates.filter(x => dayDiff(x, today) <= 30);
  const score = lead => {
    const pairs = recent.map(x => ({ f: days[x].fc && days[x].fc[lead], o: days[x].obs })).filter(p => p.f && p.f.hi != null && p.o.hi != null);
    if (!pairs.length) return null;

  if (!leads[0].s || leads[0].s.n < 5) {
    const n = leads[0].s ? leads[0].s.n : 0;
    row("Scorecard", `<span class="chip">Collecting</span>${n} of 5 days so far<small>Recording since ${niceDate(h.started)}. Scores appear after 5 days with both a forecast and a result.</small>`);
  } else {
    const t = leads.filter(x => x.s).map(x => `<tr><th scope="row">${x.L} day${x.L > 1 ? "s" : ""} out</th><td class="num">${x.s.avg.toFixed(1)}°</td><td class="num">${x.s.within}%</td><td class="num">${x.s.n}</td></tr>`).join("");

  }

  /* Almanac: today against normal and record */

  }

  /* Season log */
  const ly = days[shiftDate(today, -365)];
  if (ly && ly.obs) row("A year ago", `High <b class="num">${r0(ly.obs.hi)}°</b>, low <b class="num">${r0(ly.obs.lo)}°</b>${ly.obs.rain >= 0.01 ? `, ${ly.obs.rain.toFixed(2)} in of rain` : ", dry"}`);
  if (obsDates.length) {
    const hiD = obsDates.reduce((a, x) => days[x].obs.hi > days[a].obs.hi ? x : a, obsDates[0]);
    const loD = obsDates.reduce((a, x) => days[x].obs.lo < days[a].obs.lo ? x : a, obsDates[0]);
    row("On record", `Warmest <b class="num">${r0(days[hiD].obs.hi)}°</b> on ${niceDate(hiD)}, coldest <b class="num">${r0(days[loD].obs.lo)}°</b> on ${niceDate(loD)}<small>${obsDates.length} days recorded since ${niceDate(h.started)}</small>`);
    const ym = today.slice(0, 7), lym = String(Number(ym.slice(0, 4)) - 1) + ym.slice(4);
    const mRain = sum(obsDates.filter(x => x.startsWith(ym)).map(x => days[x].obs.rain || 0));
    const lyDays = obsDates.filter(x => x.startsWith(lym) && x.slice(8) <= today.slice(8));
    row("Rain this month", `<b class="num">${mRain.toFixed(2)} in</b> so far${lyDays.length ? `<small>Same point last year: ${sum(lyDays.map(x => days[x].obs.rain || 0)).toFixed(2)} in</small>` : ""}`);
    /* Frost season runs Jul 1 to Jun 30 */

/* ---------- Garden (Fort Oglethorpe backyard) ----------

}
const radar = { map: null, layers: {}, frame: RADAR_STEPS.length - 1, timer: null, hold: 0, recolor: true, lut: new Map(), bands: null, marker: null, loc: null, labels: null, ok: false, loading: null };
/* Leaflet loads only when a town's radar is first opened, so the Home page stays fast. */
function loadLeaflet() {
  if (typeof L !== "undefined") return Promise.resolve(true);
  if (radar.loading) return radar.loading;
  radar.loading = new Promise(res => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
    document.head.appendChild(css);
    const js = document.createElement("script");
    js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    js.onload = () => res(true); js.onerror = () => { radar.loading = null; res(false); };
    document.head.appendChild(js);
  });
  return radar.loading;
}

function recolorPixels(px) {
  const bands = radar.bands;
  for (let i = 0; i < px.length; i += 4) {
    if (px[i + 3] === 0) continue;
    const key = (px[i] << 16) | (px[i + 1] << 8) | px[i + 2];
    let out = radar.lut.get(key);
    if (!out) {
      const mx = Math.max(px[i], px[i + 1], px[i + 2]), mn = Math.min(px[i], px[i + 1], px[i + 2]);
      if (mx - mn < 40) { out = [0, 0, 0, 0]; radar.lut.set(key, out); }
    }
    if (!out) {
      let best = 0, bd = Infinity;
      for (let k = 0; k < NWS_REFL.length; k++) {
        const c = NWS_REFL[k], dr = px[i] - c[1], dg = px[i + 1] - c[2], db = px[i + 2] - c[3], dd = dr * dr + dg * dg + db * db;
        if (dd < bd) { bd = dd; best = k; }
      }
      const dbz = NWS_REFL[best][0];
      let band = null;
      for (const b of bands) if (dbz >= b.min) band = b;
      out = band ? [band.rgb[0], band.rgb[1], band.rgb[2], band.a] : [0, 0, 0, 0];
      radar.lut.set(key, out);
    }
    px[i] = out[0]; px[i + 1] = out[1]; px[i + 2] = out[2]; px[i + 3] = out[3] ? Math.min(out[3], px[i + 3]) : 0;
  }
}
function makeRadarLayer(minsAgo) {
  const url = "https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913" + (minsAgo ? "-m" + String(minsAgo).padStart(2, "0") + "m" : "") + "/{z}/{x}/{y}.png";
  const Layer = L.GridLayer.extend({
    createTile(coords, done) {
      const tile = document.createElement("canvas"), size = this.getTileSize();
      tile.width = size.x; tile.height = size.y;
      const src = L.Util.template(url, coords), ctx = tile.getContext("2d");
      const plain = () => {
        const im2 = new Image();
        im2.onload = () => { ctx.drawImage(im2, 0, 0, size.x, size.y); if (radar.recolor) { radar.recolor = false; radarLegend(); } done(null, tile); };
        im2.onerror = () => done(null, tile);
        im2.src = src;
      };
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        ctx.drawImage(img, 0, 0, size.x, size.y);
        try { const id = ctx.getImageData(0, 0, size.x, size.y); recolorPixels(id.data); ctx.putImageData(id, 0, 0); done(null, tile); }
        catch (e) { ctx.clearRect(0, 0, size.x, size.y); plain(); }
      };
      img.onerror = plain;
      img.src = src;
      return tile;
    }
  });
  return new Layer({ opacity: 0, maxNativeZoom: 12, maxZoom: 12, attribution: 'Radar: <a href="https://mesonet.agron.iastate.edu/" target="_blank" rel="noopener">IEM</a> / NWS' });
}
function radarLegend() {
  const el = $("radar-legend");
  if (!radar.recolor) {
    el.innerHTML = "";
    $("radar-note").textContent = "Radar from NWS NEXRAD via Iowa Environmental Mesonet. The tile server didn't allow recoloring, so this shows the standard palette: green is light, yellow moderate, red heavy.";
    return;
  }
  el.innerHTML = radar.bands.map(b => `<span><i style="background:rgba(${b.rgb.join(",")},${(b.a / 255).toFixed(2)})"></i><span>${b.label}<br><small>${b.sub}</small></span></span>`).join("");
}
function radarInit() {
  if (radar.map || !radar.ok) return;
  radar.bands = radarBands();
  const dark = radar.bands[5].rgb[0] === 255;
  radar.map = L.map("radar-map", { zoomControl: true, attributionControl: true, minZoom: 4, maxZoom: 12 });
  /* Esri's gray canvas basemap needs no API key. If it fails, fall back to standard OpenStreetMap tiles. */
  const esri = name => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${dark ? "Dark" : "Light"}_Gray_${name}/MapServer/tile/{z}/{y}/{x}`;
  const baseLayer = L.tileLayer(esri("Base"), { maxZoom: 12, maxNativeZoom: 16, attribution: 'Map &copy; <a href="https://www.esri.com/" target="_blank" rel="noopener">Esri</a>, HERE, Garmin, &copy; OpenStreetMap' }).addTo(radar.map);
  let baseErrors = 0;
  baseLayer.on("tileerror", () => {
    if (++baseErrors !== 4) return;
    radar.map.removeLayer(baseLayer);
    if (radar.labels) radar.map.removeLayer(radar.labels);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 12, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' }).addTo(radar.map).bringToBack();
  });
  RADAR_STEPS.forEach((m, k) => { radar.layers[k] = makeRadarLayer(m).addTo(radar.map); });
  radar.map.createPane("labels");
  radar.map.getPane("labels").style.zIndex = 450;
  radar.map.getPane("labels").style.pointerEvents = "none";
  radar.labels = L.tileLayer(esri("Reference"), { maxZoom: 12, maxNativeZoom: 16, pane: "labels" }).addTo(radar.map);
  radarLegend();
  radarFrame(RADAR_STEPS.length - 1);
}
function radarFrame(k) {
  radar.frame = k;
  Object.entries(radar.layers).forEach(([i, l]) => l.setOpacity(Number(i) === k ? 1 : 0));
  $("radar-slider").value = k;
  const m = RADAR_STEPS[k];
  const at = new Date(Date.now() - m * 60000).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: state.data ? state.data.timezone : undefined });
  $("radar-time").textContent = m === 0 ? "Latest" : `${m} min ago`;
  $("radar-time").title = "About " + at;
}
async function radarShow(loc) {
  radar.ok = await loadLeaflet();
  if (state.loc !== loc) return;
  if (!radar.ok) {
    $("radar-map").innerHTML = '<p class="radar-note" style="padding:12px">The map library didn\'t load. Check your connection and reopen the app.</p>';
    return;
  }
  radarInit();
  if (radar.loc !== loc) {
    radar.loc = loc;
    radar.map.setView([loc.lat, loc.lon], 8);
    if (radar.marker) radar.marker.remove();
    try { radar.marker = L.circleMarker([loc.lat, loc.lon], { radius: 6, color: "#ffffff", weight: 2, fillColor: "#16202c", fillOpacity: 1 }).addTo(radar.map).bindTooltip(loc.name); }
    catch (e) { radar.marker = null; }
  }
  setTimeout(() => radar.map.invalidateSize(), 0);
}
function radarStop() {
  if (radar.timer) { clearInterval(radar.timer); radar.timer = null; }
  const b = $("radar-play"); if (b) b.textContent = "Play";
}
function radarToggle() {
  if (radar.timer) { radarStop(); return; }
  $("radar-play").textContent = "Pause";
  if (radar.frame === RADAR_STEPS.length - 1) radarFrame(0);
  radar.timer = setInterval(() => {
    if (radar.frame === RADAR_STEPS.length - 1) { if (++radar.hold < 3) return; radar.hold = 0; radarFrame(0); return; }
    radarFrame(radar.frame + 1);
  }, 550);
}
function radarRefresh() {
  /* Tiles for "latest" and "5 min ago" change over time; redraw them on refresh. */
  if (!radar.map) return;
  Object.values(radar.layers).forEach(l => l.redraw());
}
document.addEventListener("input", e => { if (e.target.id === "radar-slider") { radarStop(); radarFrame(Number(e.target.value)); } });

/* ---------- Page switching for Fort Oglethorpe ---------- */
function setPage(page, fromSwipe) {
  if (!state.loc || page === state.page) return;
  const dir = page === "yard" ? "slide-left" : "slide-right";
  state.page = page;
  if (fromSwipe) store.set("pw-swiped", "1");
  const det = $("detail");
  det.classList.remove("slide-left", "slide-right"); void det.offsetWidth; det.classList.add(dir);
  renderAll();
  const top = $("subnav").getBoundingClientRect().top;
  if (top < 0) window.scrollBy(0, top - 8);
}
/* A sideways swipe switches pages, unless it starts on something that scrolls or pans sideways itself. */
(() => {
  let x0 = null, y0 = null, t0 = 0;
  const NO_SWIPE = ".hscroll, .radar-map, .cmp-wrap, input, .leaflet-container";
  document.addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || e.target.closest(NO_SWIPE)) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Date.now() - t0 > 800 || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    setPage(dx < 0 ? "yard" : "weather", true);
  }, { passive: true });
})();

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.loc) {
    const l = b.dataset.loc === "home" ? null : LOCATIONS.find(x => x.id === b.dataset.loc) || null;
    if (l !== state.loc) { state.loc = l; state.page = "weather"; store.set("pw-loc", l ? l.id : "home"); window.scrollTo(0, 0); renderAll(); load(false); }
  } else if (b.dataset.page) {
    setPage(b.dataset.page);
  } else if (b.dataset.metric) {
    state.metric = b.dataset.metric; store.set("pw-metric", state.metric);
    const sc = $("hscroll"), x = sc ? sc.scrollLeft : 0;
    renderHourly(state.data);
    const sc2 = $("hscroll"); if (sc2) sc2.scrollLeft = x;
  } else if (b.id === "radar-play") {
    radarToggle();
  } else if (b.id === "refresh") {
    load(true); radarRefresh();
  }
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && Date.now() - oldestFetch() > REFRESH_MS) load(false);
});
setInterval(() => { if (!document.hidden) load(true); }, REFRESH_MS);

renderAll();
load(false);
</script>
</body>
